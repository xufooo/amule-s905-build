; Merge selected keys into the EXISTING amule.conf while amuled is stopped.
; This is an overlay, never a replacement config. Ports, passwords, paths,
; categories, connection limits and share-root files are deliberately absent.
[eMule]
SlotAllocation=10
CheckDiskspace=1
MinFreeDiskSpace=10240
Endgame=1
KadMaxSourceSearches=30
KadSourceReaskMinutes=30
SourceReaskMinutes=15
CreateSparseFiles=1
AllocateFullFile=0
MMapEnabled=0
AutoRescanSharedDirs=1
FollowSymlinksInShares=0
ShareHiddenFiles=0
GeoIPEnabled=1
GeoIPSource=dbip
GeoIPAutoUpdate=1

[MediaMetadata]
; Optional media inspection is not needed for downloading or recursive shares.
Enabled=0
FFProbePath=
